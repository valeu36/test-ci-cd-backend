# Disposable services for the e2e suites: data on tmpfs, gone on `down`.
# Credentials and ports are literals, matching DATABASE_URL in the .env.testing
# that scripts/ensure-env-testing.sh writes. 5433 rather than 5432 so the dev
# stack can be up alongside this one.
name: test-ci-cd-test

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    # `docker compose up --wait` (npm run docker:test:up) blocks on this, so
    # nothing needs its own pg_isready loop.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_test']
      interval: 2s
      timeout: 5s
      retries: 30
